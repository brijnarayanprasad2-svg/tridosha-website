
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO: Page title -->
    <title>
      Tridosha Ayurvedic Massage Center | Ayurvedic Wellness
    </title>

    <!-- SEO: Page description -->
    <meta
      name="description"
      content="Discover traditional Ayurvedic massage and wellness therapies at Tridosha Ayurvedic Massage Center. Explore our services and book your wellness session."
    />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Browser theme -->
    <meta name="theme-color" content="#0b1710" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph: social sharing -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:title"
      content="Tridosha Ayurvedic Massage Center"
    />
    <meta
      property="og:description"
      content="Explore traditional Ayurvedic massage and wellness therapies at Tridosha."
    />
    <meta
      property="og:url"
      content="https://tridosha-website.pages.dev/"
    />
    <meta
      property="og:site_name"
      content="Tridosha Ayurvedic Massage Center"
    />

    <!-- Font connections -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
